apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: churn-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yancharskaya/churn-deployment.git
    targetRevision: main
    path: charts/churn-service 
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
